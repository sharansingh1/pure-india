name: Sync menu from Clover

on:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            --fail-with-body \
            "https://www.pureindiacuisine.com/api/sync-clover"
